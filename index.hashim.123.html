<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بطاقة تعريف شخصية</title>
    <!-- ربط ملف التنسيق الخارجي -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- حاوية البطاقة الشخصية -->
    <div class="profile-card">
        
        <!-- الصورة الشخصية -->
        <img src="https://via.placeholder.com/120" alt="" class="profile-img">
        
        <!-- الاسم (العنوان الرئيسي) -->
        <h1 class="profile-name">هاشم الخطيب</h1>
        
        <!-- المسمى الوظيفي -->
        <p class="profile-title">مطور برمجيات ومهندس برمجيات</p>
        
        <!-- نبذة قصيرة -->
        <p class="profile-bio">
            شغوف بتطوير تطبيقات الويب وبناء الحلول البرمجية الذكية. أسعى دائماً لتعلم تقنيات جديدة وتحويل الأفكار إلى واقع رقمي.
        </p>
        
        <!-- زر التواصل -->
        <button class="contact-btn">تواصل معي</button>
        
    </div>

</body>
</html>
